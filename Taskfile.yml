# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  run:
    desc: Run the project against the repo's test config (scripts/xdg)
    # The config layer reads $XDG_CONFIG_HOME/easypg, so pointing the variable at
    # scripts/xdg picks up the committed test profiles instead of the
    # contributor's own ~/.config/easypg. Run `go run .` to use the real one.
    cmds:
      - XDG_CONFIG_HOME=scripts/xdg go run .

  check:
    desc: Build and vet the project
    cmds:
      - go build ./...
      - go vet ./...

  deps:
    desc: Upgrade every dependency to its latest release, then tidy
    cmds:
      - go get -u ./...
      - go mod tidy

  deps-outdated:
    desc: List the dependencies that have a newer release
    # go list marks an available upgrade with a [bracketed] version; without the
    # filter the interesting lines are lost among the forty that are up to date.
    cmds:
      - go list -m -u all | grep '\[' || echo "all dependencies are up to date"
